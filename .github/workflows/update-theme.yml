name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 1 * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  Update-FixIt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update theme (latest stable tag only)
        run: |
          set -euo pipefail
          cd themes/FixIt
          git fetch --tags --force origin
          # latest tag, skipping pre-releases (v1.0.0-alpha / -beta / -rc and variants)
          LATEST=$(git tag --sort=-v:refname | grep -vE -- '-(alpha|beta|rc)' | head -n1)
          TARGET=$(git rev-parse "${LATEST}^{commit}")
          CURRENT=$(git rev-parse HEAD)
          if [ "$TARGET" = "$CURRENT" ]; then
            echo "FixIt already at latest stable tag $LATEST"
            exit 0
          fi
          # forward-only: never downgrade below the current pin
          if [ "$(git show -s --format=%ct "$TARGET")" -lt "$(git show -s --format=%ct "$CURRENT")" ]; then
            echo "Latest stable tag $LATEST is not newer than the current pin, skipping"
            exit 0
          fi
          git checkout -q "$LATEST"
          echo "Pinned FixIt to $LATEST ($(git rev-parse --short HEAD))"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ':arrow_up: Chore(theme): update FixIt version'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
